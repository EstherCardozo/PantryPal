name: pantrypal
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core (required by firebase_messaging 16.x)
  firebase_core: ^4.1.0

  # Firebase packages aligned with firebase_core ^4.x
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.0

  # Other dependencies
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^7.0.1        
  google_fonts: ^6.3.1
  http: ^1.5.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.0.0
  flutter_slidable: ^4.0.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.4.1
  workmanager: ^0.9.0+2
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.5
  flutter_typeahead: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - pictures/Logo.png
    - pictures/beetroot.png
    - pictures/cookies.png
    - pictures/eggs.png
    - pictures/olive oil.png
    - pictures/bananas.png
    - pictures/cauliflower.png
    - pictures/cereals.png
    - pictures/chocolate.png
    - pictures/dairy-products.png
    - pictures/fresh-fruits-and-vegetables.png
    - pictures/fresh-meat.png
    - pictures/macaroni.png
    - pictures/medicine-capsules.png
    - pictures/seeds-and-grains.png
    - pictures/snacks.png
    - pictures/spices.png
    - pictures/all.png
    - pictures/sweets.png
